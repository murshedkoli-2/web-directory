<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="wGrad" x1="60" y1="120" x2="452" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Glowing Geometric Nexus W -->
  <g filter="url(#glow)">
    <!-- Connections / Mesh Lines -->
    <path d="M100 160 L180 370 L256 220 L332 370 L412 160" stroke="url(#wGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M100 160 L256 220 M180 370 L412 160 M100 160 L332 370" stroke="url(#wGrad)" stroke-width="6" stroke-opacity="0.45" stroke-linecap="round" />
    <path d="M180 370 L332 370" stroke="url(#wGrad)" stroke-width="8" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- Luminous Nexus Nodes -->
    <circle cx="100" cy="160" r="16" fill="#ec4899" />
    <circle cx="180" cy="370" r="18" fill="#8b5cf6" />
    <circle cx="256" cy="220" r="18" fill="#6366f1" />
    <circle cx="332" cy="370" r="18" fill="#3b82f6" />
    <circle cx="412" cy="160" r="16" fill="#06b6d4" />

    <!-- White Inner Core Highlights -->
    <circle cx="100" cy="160" r="7" fill="#ffffff" />
    <circle cx="180" cy="370" r="8" fill="#ffffff" />
    <circle cx="256" cy="220" r="8" fill="#ffffff" />
    <circle cx="332" cy="370" r="8" fill="#ffffff" />
    <circle cx="412" cy="160" r="7" fill="#ffffff" />
  </g>
</svg>
